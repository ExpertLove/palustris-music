name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Бэкенд (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --locked

  web:
    name: Сайт (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  android:
    name: Android (сборка APK и юнит-тесты)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # SDK на раннере уже есть; принимаем лицензии, а недостающие платформу и build-tools
      # Gradle докачает сам.
      - name: Лицензии Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null
      - uses: gradle/actions/setup-gradle@v6
      # Ключа подписи в CI нет и не будет (репозиторий публичный): собираем отладочную версию.
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: muzyka-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
