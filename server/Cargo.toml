[package]
name = "music"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
anyhow = "1"
aes = "0.8"
base64 = "0.22"
ctr = "0.9"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "tokio1", "tokio1-rustls"] }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
